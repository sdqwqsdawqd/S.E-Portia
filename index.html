<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Устав Portia — Kurodzakura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css?v=16">
<link rel="icon" type="image/png" href="Portia.png">
</head>

<body>

  <div class="app-shell">

    <!-- БОКОВАЯ ПАНЕЛЬ (ПК) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="emblem">
          <div class="emblem">
  <img src="Portia2.png" alt="PORTIA" width="50" height="50">
          </div>
        </div>
        <div class="wordmark">
          <span class="wordmark-title">PORTIA</span>
          <span class="wordmark-sub">Устав отдела</span>
        </div>
      </div>

      <nav class="nav-list" aria-label="Разделы устава">
        <button type="button" class="nav-item active" data-target="page1"><span class="nav-num">01</span><span>О отделе</span></button>
        <button type="button" class="nav-item" data-target="page2"><span class="nav-num">02</span><span>Правила</span></button>
        <button type="button" class="nav-item" data-target="page3"><span class="nav-num">03</span><span>Норма отдела</span></button>
        <button type="button" class="nav-item" data-target="page4"><span class="nav-num">04</span><span>Повышения и иерархия</span></button>
        <button type="button" class="nav-item" data-target="page5"><span class="nav-num">05</span><span>Квалиф. проверки</span></button>
        <button type="button" class="nav-item" data-target="page6"><span class="nav-num">06</span><span>Информация</span></button>
        <button type="button" class="nav-item" data-target="page7"><span class="nav-num">07</span><span>Логи</span></button>
        <button type="button" class="nav-item" data-target="page8"><span class="nav-num">08</span><span>История руководства</span></button>
      </nav>

      <div class="sidebar-footer">
        <span class="footer-line">KURODZAKURA S.E.</span>
        <span class="footer-line muted">Внутренний устав отдела "Portia"</span>
      </div>
    </aside>

    <!-- МОБИЛЬНАЯ ШАПКА -->
    <div class="mobile-bar">
      <div class="mobile-brand">
        <span class="mobile-emblem">
          <img src="Portia2.png" alt="PORTIA" width="22" height="22">
        </span>
        <span class="mobile-title">PORTIA</span>
      </div>

      <div class="mobile-tabs" id="mobileTabs">
        <button type="button" class="mobile-pill active" data-target="page1"><span class="pill-num">01</span><span>О отделе</span></button>
        <button type="button" class="mobile-pill" data-target="page2"><span class="pill-num">02</span><span>Правила</span></button>
        <button type="button" class="mobile-pill" data-target="page3"><span class="pill-num">03</span><span>Норма</span></button>
        <button type="button" class="mobile-pill" data-target="page4"><span class="pill-num">04</span><span>Иерархия</span></button>
        <button type="button" class="mobile-pill" data-target="page5"><span class="pill-num">05</span><span>Проверки</span></button>
        <button type="button" class="mobile-pill" data-target="page6"><span class="pill-num">06</span><span>Инфо</span></button>
        <button type="button" class="mobile-pill" data-target="page7"><span class="pill-num">07</span><span>Логи</span></button>
        <button type="button" class="mobile-pill" data-target="page8"><span class="pill-num">08</span><span>История</span></button>
      </div>
    </div>

    <main class="content-area">
      <div class="paper">
        <div class="paper-meta">
          <div class="section-mark" aria-hidden="true">
            <span class="section-number" id="paperSectionNumber">01</span>
            <span class="section-label">SECTION</span>
          </div>
          <span class="paper-eyebrow" id="paperEyebrow">Раздел 01 из 08 — О отделе</span>
        </div>
        <div id="right-page-content" class="paper-body">
        </div>
      </div>
    </main>

  </div>

  <script src="script.js?v=14"></script>

</body>
</html>
